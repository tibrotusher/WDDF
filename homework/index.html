<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibro Tusher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HTML Forms</h1>
  <form>
    <label for="">Username</label><br>
    <input type="text" name="username" id="" placeholder="Enter your Username"><br><br>
    <label for="">Password</label><br>
    <input type="password" name="password" id="" placeholder="Enter your Password"><br><br>
    <input type="button" value="Submit">
  </form><br><br>
  <table>
    <tr>
      <th rowspan="2">State of Health</th>
      <th colspan ="2">Fasting Value</th>
      <th>After Eating</th>
    </tr>
    <tr>
      <th>Minimum</th>
      <th>Maximum</th>
      <th>2 Hours after Eating</th>
    </tr>
    <tr>
      <td>Healthy</td>
      <td>70</td>
      <td>100</td>
      <td>Less then 100</td>
    </tr>
    <tr>
      <td>Pre-Diabetes</td>
      <td>101</td>
      <td>126</td>
      <td>140 to 200</td>
    </tr>
    <tr>
      <td>Diabetes</td>
      <td>More then 126</td>
      <td>N/A</td>
      <td>More then 200</td>
    </tr>
  </table>
  
</body>
</html>
